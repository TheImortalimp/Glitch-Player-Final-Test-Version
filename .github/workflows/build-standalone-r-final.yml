name: Build Standalone Revision-R Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package with 75MB cap
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File extras\glitch-canvas-player\scripts\build-standalone-r-final.ps1 -TargetMaxMb 75 -HardFailMb 100

      - name: Locate artifacts
        id: artifact
        shell: pwsh
        run: |
          $zipPath = "extras\glitch-canvas-player\dist\standalone-revision-R-final-1.0-package.zip"
          $exePath = "extras\glitch-canvas-player\dist\standalone-revision-R-final-1.0-installer.exe"
          if (-not (Test-Path $zipPath)) {
            throw "ZIP artifact not found: $zipPath"
          }
          if (-not (Test-Path $exePath)) {
            throw "EXE artifact not found: $exePath"
          }
          $zipSizeMb = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          $exeSizeMb = [math]::Round((Get-Item $exePath).Length / 1MB, 2)
          Write-Host "ZIP artifact size: $zipSizeMb MB"
          Write-Host "EXE artifact size: $exeSizeMb MB"
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_path=$exePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-revision-R-final-1.0-artifacts
          path: |
            ${{ steps.artifact.outputs.zip_path }}
            ${{ steps.artifact.outputs.exe_path }}
          if-no-files-found: error
