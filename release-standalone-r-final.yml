name: Release Standalone Revision-R Final

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File extras\glitch-canvas-player\scripts\build-standalone-r-final.ps1 -TargetMaxMb 75 -HardFailMb 100

      - name: Verify artifact
        shell: pwsh
        run: |
          $artifactPath = "extras\glitch-canvas-player\dist\standalone-revision-R-final-1.0-package.zip"
          if (-not (Test-Path $artifactPath)) {
            throw "Artifact not found: $artifactPath"
          }
          $sizeMb = [math]::Round((Get-Item $artifactPath).Length / 1MB, 2)
          Write-Host "Artifact size: $sizeMb MB"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: standalone revision-R final 1.0 - ${{ inputs.tag }}
          files: extras/glitch-canvas-player/dist/standalone-revision-R-final-1.0-package.zip
          draft: false
          prerelease: false
